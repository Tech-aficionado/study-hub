<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locked · Study Hub</title>
<style>
  :root{
    --bg:#0b0d12; --bg2:#121520; --bg3:#171b28; --card:#141825;
    --border:#262b3b; --text:#eef1f8; --muted:#8c93a8;
    --accent:#6e7bff; --accent2:#9aa5ff; --accent3:#4ee1c2;
    --danger:#ff6e6e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 20% -10%, #1b2140 0%, var(--bg) 55%);
    color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    width:100%; max-width:380px; background:linear-gradient(180deg,var(--bg3),var(--card));
    border:1px solid var(--border); border-radius:20px; padding:36px 32px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .lock-icon{
    width:60px; height:60px; margin:0 auto 18px; border-radius:16px; display:flex; align-items:center;
    justify-content:center; font-size:28px; background:linear-gradient(135deg,var(--accent),var(--accent3));
    box-shadow:0 8px 24px rgba(110,123,255,.35);
  }
  h1{font-size:19px; margin:0 0 6px; font-weight:800;}
  .sub{color:var(--muted); font-size:13px; margin:0 0 26px;}
  .topic-name{color:var(--accent2); font-weight:700;}
  input[type=password]{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:15px; margin-bottom:12px; outline:none;
  }
  input[type=password]:focus{border-color:var(--accent);}
  button{
    width:100%; padding:13px; border-radius:12px; border:none; font-size:14.5px; font-weight:700;
    cursor:pointer; margin-bottom:10px; transition:transform .15s ease, opacity .15s ease;
  }
  button:active{transform:scale(.98);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;}
  .btn-fingerprint{background:rgba(78,225,194,.14); color:var(--accent3); border:1px solid rgba(78,225,194,.3);}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text); border-color:var(--accent);}
  .err{color:var(--danger); font-size:12.5px; min-height:16px; margin:-2px 0 10px;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:11px; margin:14px 0; text-transform:uppercase; letter-spacing:.06em;}
  .divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--border);}
  .setup{display:none;}
  .setup.show{display:block;}
  .unlock{display:none;}
  .unlock.show{display:block;}
  .hint{color:var(--muted); font-size:11.5px; margin-top:14px; line-height:1.5;}
  .back-link{display:inline-block; margin-top:18px; color:var(--muted); font-size:12.5px; text-decoration:none;}
  .back-link:hover{color:var(--accent2);}
  .reset-link{display:inline-block; margin-top:4px; color:var(--muted); font-size:11px; text-decoration:underline; cursor:pointer;}
  .reset-link:hover{color:var(--danger);}
</style>
</head>
<body>
<div class="card">
  <div class="lock-icon">🔒</div>
  <h1>Personal Study Material</h1>
  <p class="sub">This topic is locked.</p>

  <!-- First-time setup: no password registered yet on this device/browser -->
  <div class="setup" id="setupBlock">
    <p class="sub" style="margin-bottom:16px;">Set a password for your personal B.Tech topics. This only applies on this device/browser.</p>
    <input type="password" id="setupPw" placeholder="Choose a password" autocomplete="new-password">
    <input type="password" id="setupPw2" placeholder="Confirm password" autocomplete="new-password">
    <div class="err" id="setupErr"></div>
    <button class="btn-primary" id="setupSaveBtn">Set password & unlock</button>
    <div class="hint">You can also add a fingerprint/Windows Hello unlock right after, from inside the topic.</div>
  </div>

  <!-- Normal unlock: password already set on this device -->
  <div class="unlock" id="unlockBlock">
    <input type="password" id="pw" placeholder="Enter password" autocomplete="current-password">
    <div class="err" id="unlockErr"></div>
    <button class="btn-primary" id="unlockBtn">Unlock</button>
    <button class="btn-fingerprint" id="fingerprintBtn" style="display:none;">👆 Unlock with fingerprint / Windows Hello</button>
    <div class="divider">or</div>
    <span class="reset-link" id="resetLink">Forgot password? Reset lock on this device</span>
  </div>

  <a class="back-link" href="../index.html">← Back to Study Hub</a>
</div>

<script src="js/lock.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var next = params.get('next') || '../index.html';

  function goNext() {
    location.href = next;
  }

  if (window.StudyHubLock.isUnlocked()) {
    goNext();
  }

  var hasPw = window.StudyHubLock.hasPassword();
  document.getElementById(hasPw ? 'unlockBlock' : 'setupBlock').classList.add('show');

  if (hasPw && window.StudyHubLock.hasFingerprint() && window.StudyHubLock.webAuthnSupported()) {
    document.getElementById('fingerprintBtn').style.display = 'block';
  }

  // First-time setup
  document.getElementById('setupSaveBtn').addEventListener('click', function () {
    var p1 = document.getElementById('setupPw').value;
    var p2 = document.getElementById('setupPw2').value;
    var err = document.getElementById('setupErr');
    err.textContent = '';
    if (!p1 || p1.length < 4) { err.textContent = 'Password must be at least 4 characters.'; return; }
    if (p1 !== p2) { err.textContent = 'Passwords do not match.'; return; }
    window.StudyHubLock.setPassword(p1).then(function () {
      window.StudyHubLock.setUnlocked();
      goNext();
    });
  });

  // Normal unlock
  document.getElementById('unlockBtn').addEventListener('click', attemptUnlock);
  document.getElementById('pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') attemptUnlock();
  });

  function attemptUnlock() {
    var pw = document.getElementById('pw').value;
    var err = document.getElementById('unlockErr');
    err.textContent = '';
    window.StudyHubLock.checkPassword(pw).then(function (ok) {
      if (ok) {
        window.StudyHubLock.setUnlocked();
        goNext();
      } else {
        err.textContent = 'Incorrect password.';
      }
    });
  }

  document.getElementById('fingerprintBtn').addEventListener('click', function () {
    var err = document.getElementById('unlockErr');
    err.textContent = '';
    window.StudyHubLock.unlockWithFingerprint().then(function (ok) {
      if (ok) {
        window.StudyHubLock.setUnlocked();
        goNext();
      } else {
        err.textContent = 'Fingerprint check failed.';
      }
    }).catch(function () {
      err.textContent = 'Fingerprint unlock failed or was cancelled.';
    });
  });

  document.getElementById('resetLink').addEventListener('click', function () {
    if (confirm('Reset the lock on this device? You will need to set a new password, and any registered fingerprint unlock will be removed. This only affects this browser/device.')) {
      window.StudyHubLock.forgetDevice();
      location.reload();
    }
  });
</script>
</body>
</html>
